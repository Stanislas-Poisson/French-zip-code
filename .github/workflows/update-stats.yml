name: Update stats

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The cards live on their own branch: main and develop only accept pull requests.
      - name: Prepare the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats > /dev/null; then
            git fetch origin stats
            git worktree add stats origin/stats
            git -C stats checkout -B stats origin/stats
          else
            git worktree add --detach stats
            git -C stats checkout --orphan stats
            git -C stats rm -rf --quiet .
          fi

      # The traffic endpoints need push access: STATS_TOKEN is a token of the maintainer.
      # Without it, the views and clones are left out and everything else is still updated.
      - name: Generate the cards
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          OUT_DIR: stats
        run: python3 .github/scripts/generate_stats.py

      - name: Publish the stats branch
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json stats.svg dataset.svg
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore(stats): refresh the statistics cards"
            git push origin stats
          fi
