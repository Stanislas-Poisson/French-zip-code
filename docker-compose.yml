services:
  php:
    build: ./docker/php
    # Keep the container alive so `make ssh` can attach to it.
    command: ["sleep", "infinity"]
    volumes:
      - .:/var/www/html:rw
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - 3306:3306
    volumes:
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: frenchzipcode
      MYSQL_USER: frenchzipcode
      MYSQL_PASSWORD: frenchzipcode
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
    driver: local
