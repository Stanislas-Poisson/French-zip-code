services:
  php:
    image: zairakai/php:latest-test
    # The image is a PHP-FPM one: keep it alive as a plain CLI container and drop its FPM healthcheck and banner.
    entrypoint: []
    command: ["sleep", "infinity"]
    healthcheck:
      disable: true
    volumes:
      - .:/var/www/html:rw
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-project.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - 3306:3306
    volumes:
      - ./docker/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: frenchzipcode
      MYSQL_USER: frenchzipcode
      MYSQL_PASSWORD: frenchzipcode
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
